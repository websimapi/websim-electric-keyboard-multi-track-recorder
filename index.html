<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Keyboard Multi-Track Recorder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Electric Keyboard Studio</h1>
            <div class="master-controls">
                <button id="playAll" class="btn btn-primary">
                    <span class="icon">▶</span>
                    Play All
                </button>
                <button id="stopAll" class="btn btn-danger">
                    <span class="icon">⏹</span>
                    Stop All
                </button>
                <div class="master-volume">
                    <label>Master Volume</label>
                    <input type="range" id="masterVolume" min="0" max="100" value="50">
                    <span id="volumeDisplay">50%</span>
                </div>
            </div>
        </header>

        <div class="tracks-section">
            <h2>Recording Tracks</h2>
            <div id="tracksList" class="tracks-list">
                <!-- Tracks will be dynamically added here -->
            </div>
            <button id="addTrack" class="btn btn-secondary">
                <span class="icon">+</span>
                Add New Track
            </button>
        </div>

        <div class="audio-transcription-section">
            <h2>Audio Transcription</h2>
            <div class="transcription-controls">
                <button id="startAudioCapture" class="btn btn-primary">
                    <span class="icon">🎤</span>
                    Record Audio
                </button>
                <button id="stopAudioCapture" class="btn btn-danger" disabled>
                    <span class="icon">⏹</span>
                    Stop Recording
                </button>
                <button id="playTranscription" class="btn btn-success" disabled>
                    <span class="icon">▶</span>
                    Play Transcription
                </button>
                <button id="clearTranscription" class="btn btn-secondary">
                    <span class="icon">🗑</span>
                    Clear
                </button>
            </div>
            <div class="transcription-display">
                <canvas id="scoreCanvas" width="800" height="200"></canvas>
                <div id="transcriptionNotes" class="transcription-notes"></div>
            </div>
        </div>

        <div class="keyboard-section">
            <div class="keyboard-controls">
                <div class="control-group">
                    <label>Octave</label>
                    <button id="octaveDown" class="btn btn-sm">-</button>
                    <span id="octaveDisplay">4</span>
                    <button id="octaveUp" class="btn btn-sm">+</button>
                </div>
                <div class="control-group">
                    <label>Waveform</label>
                    <select id="waveform">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="sawtooth">Sawtooth</option>
                        <option value="triangle">Triangle</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Attack</label>
                    <input type="range" id="attack" min="0" max="1" step="0.01" value="0.1">
                </div>
                <div class="control-group">
                    <label>Release</label>
                    <input type="range" id="release" min="0" max="2" step="0.01" value="0.3">
                </div>
            </div>
            
            <div id="keyboard" class="keyboard">
                <!-- Piano keys will be generated here -->
            </div>
        </div>

        <div class="help-section">
            <p><strong>How to use:</strong> Create tracks, press Record, play some keys, then stop recording. Label your tracks and play them together!</p>
            <p><strong>Keyboard shortcuts:</strong> Z,S,X,D,C,V,G,B,H,N,J,M for white keys. Press Q/W to change octaves.</p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
